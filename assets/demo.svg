<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 352" width="760" height="352" role="img" aria-label="Terminal recording: the auditor scans four entry points, reports the one finding it proved, and says how many suspicions it discarded.">
  <title>vulnerability-hunter-next running against an example application</title>
  <desc>The command scans four attack-surface entries. It prints the single finding whose proof reproduced, with the request that demonstrates it, then reports that two other suspicions were discarded. The shell reports exit code 1.</desc>

  <defs>
    <style>
      .win { fill: #0d1117; }
      .bar { fill: #161b22; }
      .txt { font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace; font-size: 13px; }
      .dim { fill: #7d8590; }
      .fg  { fill: #c9d1d9; }
      .ok  { fill: #3fb950; }
      .bad { fill: #f85149; }
      .acc { fill: #58a6ff; }
      .b   { font-weight: 600; }
      .row { opacity: 0; }
    </style>
  </defs>

  <rect class="win" width="760" height="352" rx="10"/>
  <rect class="bar" width="760" height="30" rx="10"/>
  <rect class="bar" y="20" width="760" height="10"/>
  <circle cx="20" cy="15" r="5" fill="#ff5f57"/>
  <circle cx="38" cy="15" r="5" fill="#febc2e"/>
  <circle cx="56" cy="15" r="5" fill="#28c840"/>
  <text class="txt dim" x="380" y="19" text-anchor="middle">vulnerability-hunter-next</text>

  <g class="txt">
    <g class="row">
      <text x="20" y="58"><tspan class="ok b">$</tspan><tspan class="fg" dx="8">npx vulnerability-hunter-next . --target http://localhost:3000</tspan></text>
      <animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="0.2s" fill="freeze"/>
    </g>

    <g class="row">
      <text class="dim" x="20" y="84">Scanned 4 attack-surface entries.</text>
      <animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="1s" fill="freeze"/>
    </g>

    <g class="row">
      <text x="20" y="120"><tspan class="bad b">HIGH</tspan><tspan class="fg" dx="16">Invoice readable without a session</tspan></text>
      <animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="2.2s" fill="freeze"/>
    </g>
    <g class="row">
      <text class="dim" x="36" y="140">app/api/invoices/[id]/route.ts:4</text>
      <animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="2.35s" fill="freeze"/>
    </g>
    <g class="row">
      <text class="dim" x="36" y="160">params.id reaches the database with no ownership check.</text>
      <animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="2.5s" fill="freeze"/>
    </g>
    <g class="row">
      <text x="36" y="184"><tspan class="acc">proof</tspan><tspan class="fg" x="120">GET http://localhost:3000/api/invoices/1</tspan></text>
      <animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="2.8s" fill="freeze"/>
    </g>
    <g class="row">
      <text x="36" y="204"><tspan class="acc">expected</tspan><tspan class="dim" x="120">responds 401 or 403 without a session</tspan></text>
      <animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="2.95s" fill="freeze"/>
    </g>
    <g class="row">
      <text x="36" y="224"><tspan class="acc">observed</tspan><tspan class="bad b" x="120">200 OK, 214 bytes</tspan></text>
      <animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="3.1s" fill="freeze"/>
    </g>

    <g class="row">
      <text x="20" y="258"><tspan class="fg b">1 proven</tspan><tspan class="dim">, 2 discarded after their proof did not reproduce.</tspan></text>
      <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="3.9s" fill="freeze"/>
    </g>

    <g class="row">
      <text x="20" y="292"><tspan class="ok b">$</tspan><tspan class="fg" dx="8">echo $?</tspan></text>
      <animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="4.5s" fill="freeze"/>
    </g>
    <g class="row">
      <text class="bad b" x="20" y="312">1</text>
      <animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="4.9s" fill="freeze"/>
    </g>
  </g>

  <rect x="20" y="328" width="8" height="15" class="ok" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.01s" begin="5.2s" fill="freeze"/>
    <animate attributeName="opacity" values="1;1;0;0;1" dur="1.1s" begin="5.2s" repeatCount="indefinite"/>
  </rect>
</svg>
