<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" width="760" height="372" role="img" aria-label="Terminal recording: the auditor maps four entry points, suspects three flaws, proves one and discards two.">
  <title>next-security-auditor running against an example application</title>
  <desc>The command maps four attack-surface entries, raises three suspicions, runs a proof request for each, keeps the one that reproduced and discards the two that did not.</desc>

  <defs>
    <style>
      .win { fill: #0d1117; }
      .bar { fill: #161b22; }
      .txt { font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace; font-size: 13px; }
      .dim { fill: #7d8590; }
      .fg  { fill: #c9d1d9; }
      .ok  { fill: #3fb950; }
      .bad { fill: #f85149; }
      .warn{ fill: #d29922; }
      .acc { fill: #58a6ff; }
      .b   { font-weight: 600; }
      .row { opacity: 0; }
    </style>
  </defs>

  <rect class="win" width="760" height="372" rx="10"/>
  <rect class="bar" width="760" height="30" rx="10"/>
  <rect class="bar" y="20" width="760" height="10"/>
  <circle cx="20" cy="15" r="5" fill="#ff5f57"/>
  <circle cx="38" cy="15" r="5" fill="#febc2e"/>
  <circle cx="56" cy="15" r="5" fill="#28c840"/>
  <text class="txt dim" x="380" y="19" text-anchor="middle">next-security-auditor</text>

  <g class="txt">
    <g class="row">
      <text x="20" y="58"><tspan class="ok b">$</tspan><tspan class="fg" dx="8">npx next-security-auditor --target http://localhost:3000</tspan></text>
      <animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="0.2s" fill="freeze"/>
    </g>

    <g class="row">
      <text class="dim" x="20" y="86">Scanned 4 attack-surface entries.</text>
      <animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="0.9s" fill="freeze"/>
    </g>

    <g class="row">
      <text x="20" y="118"><tspan class="bad b">HIGH</tspan><tspan class="fg" dx="12">Invoice readable without a session</tspan></text>
      <animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="1.6s" fill="freeze"/>
    </g>
    <g class="row">
      <text class="dim" x="36" y="138">app/api/invoices/[id]/route.ts:4</text>
      <animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="1.75s" fill="freeze"/>
    </g>
    <g class="row">
      <text class="dim" x="36" y="158">params.id reaches the database with no ownership check.</text>
      <animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="1.9s" fill="freeze"/>
    </g>
    <g class="row">
      <text x="36" y="182"><tspan class="acc">proof</tspan><tspan class="fg" x="118">GET http://localhost:3000/api/invoices/1</tspan></text>
      <animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="2.5s" fill="freeze"/>
    </g>
    <g class="row">
      <text x="36" y="202"><tspan class="acc">expected</tspan><tspan class="dim" x="118">401 or 403 without a session</tspan></text>
      <animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="2.65s" fill="freeze"/>
    </g>
    <g class="row">
      <text x="36" y="222"><tspan class="acc">observed</tspan><tspan class="bad b" x="118">200 OK, 214 bytes</tspan></text>
      <animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="2.8s" fill="freeze"/>
    </g>

    <g class="row">
      <text x="20" y="258"><tspan class="warn b">MEDIUM</tspan><tspan class="dim" dx="12">Suspected open redirect in the callback route</tspan></text>
      <animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="3.5s" fill="freeze"/>
    </g>
    <g class="row">
      <text x="36" y="278"><tspan class="acc">proof</tspan><tspan class="dim" x="118">GET /api/auth/callback?next=https://evil.test</tspan></text>
      <animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="3.65s" fill="freeze"/>
    </g>
    <g class="row">
      <text x="36" y="298"><tspan class="acc">observed</tspan><tspan class="ok b" x="118">400 Bad Request</tspan><tspan class="dim" dx="10">— discarded, it did not reproduce</tspan></text>
      <animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="3.8s" fill="freeze"/>
    </g>

    <g class="row">
      <text x="20" y="334"><tspan class="fg b">1 proven</tspan><tspan class="dim">, 2 discarded after their proof did not reproduce.</tspan></text>
      <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="4.5s" fill="freeze"/>
    </g>
    <g class="row">
      <text x="20" y="356"><tspan class="dim">exit code </tspan><tspan class="bad b">1</tspan><tspan class="dim" dx="6">— the build fails on what was proven, never on a hunch.</tspan></text>
      <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="4.9s" fill="freeze"/>
    </g>
  </g>

  <rect x="20" y="346" width="8" height="15" class="ok" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.01s" begin="5.4s" fill="freeze"/>
    <animate attributeName="opacity" values="1;1;0;0;1" dur="1.1s" begin="5.4s" repeatCount="indefinite"/>
  </rect>
</svg>
