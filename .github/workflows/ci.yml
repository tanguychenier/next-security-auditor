name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # BUILT BEFORE IT IS TESTED: the end-to-end tests drive dist/cli/main.js
      # the way a user does, so testing first passes on a stale build and fails
      # on every fresh clone.
      - run: npm run build
      - run: npm test
      # THE TOOL MAPS ITS OWN EXAMPLE PROJECT ON EVERY PUSH. A dry run needs no
      # API key and no network, and it catches the failure that matters most:
      # the day the surface mapper quietly stops finding anything at all.
      - name: map the example project
        run: |
          node dist/cli/main.js tests/fixtures/shop --dry-run | tee /tmp/surface.txt
          grep -q '/api/invoices/\[id\]' /tmp/surface.txt
          grep -q 'server-action' /tmp/surface.txt
          grep -q 'rules selected' /tmp/surface.txt
