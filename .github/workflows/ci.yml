name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # THE TOOL AUDITS ITS OWN EXAMPLE PROJECT ON EVERY PUSH. A dry run needs
      # no API key and no network, and it catches the failure that matters
      # most: the day the surface mapper stops finding anything at all.
      - name: audit the example project
        run: node dist/cli/main.js tests/fixtures/shop --dry-run
