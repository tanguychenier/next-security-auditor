name: Publish

# A TAG IS THE RELEASE, so pushing one is the whole ceremony. Nothing publishes
# from a laptop any more, which is what kept the published versions without
# provenance and tied a release to whichever machine was signed in that day.
on:
  push:
    tags: ['v*']
  # A RELEASE THAT FAILED FOR A REASON OUTSIDE THE CODE has to be re-runnable
  # without moving the tag.
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # THE PACKAGE STILL CARRIES ITS PROVENANCE. npm signs it from this
      # workflow's identity, so a reader can check where a version was built
      # even though the registry is reached with a token.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - run: npm ci

      # THE SAME GATE AS EVERY PUSH, run again here on purpose. A release is the
      # one build nobody re-runs, so it is the one that must not be taken on
      # trust from a green tick somewhere else.
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      # A TAG THAT DISAGREES WITH THE MANIFEST PUBLISHES THE WRONG VERSION, and
      # the mistake is only visible once it is on the registry and immutable.
      - name: the tag and the manifest must agree
        # ONLY A TAG CARRIES A VERSION TO AGREE WITH. A run started by hand is
        # re-running a release, and its ref is the branch.
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$manifest" ]; then
            echo "tag v$tag does not match package.json $manifest"
            exit 1
          fi

      # PUBLISHING TWICE IS NOT AN ERROR WORTH FAILING A BUILD FOR. A re-run of
      # a release that already happened should say so and stop, not paint the
      # pipeline red over work that is done.
      - name: already on the registry?
        id: state
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "vulnerability-hunter-next@${version}" version > /dev/null 2>&1; then
            echo "published=yes" >> "$GITHUB_OUTPUT"
            echo "${version} is already on the registry: nothing to do."
          else
            echo "published=no" >> "$GITHUB_OUTPUT"
          fi

      # Provenance needs a recent npm; the one bundled with Node is not always it.
      - run: npm install -g npm@latest
        if: steps.state.outputs.published == 'no'
      - run: npm publish --provenance
        if: steps.state.outputs.published == 'no'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
